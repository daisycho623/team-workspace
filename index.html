<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>CX 업무 관리</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"
    />
    <link rel="stylesheet" href="styles.css?v=20260919-7" />
  </head>
  <body>
    <div class="shell">
      <aside>
        <h2>▥ WORK<span>FLOW</span></h2>
        <small>WORKSPACE</small
        ><button class="active" data-view="list">CX</button>
        <div class="sync">
          <b>↻ Google Sheets</b><em id="sync">연결 확인 중</em>
        </div>
        <a
          target="_blank"
          href="https://docs.google.com/spreadsheets/d/1QEgjN6IXs473j1oNuTt-5WM39CcihQNHfUN7Piyp6WI/edit?usp=sharing"
          >원본 시트 열기 ↗</a
        >
      </aside>
      <main>
        <header>
          <div>
            <small>CX OPERATIONS</small>
            <h1>업무 관리</h1>
          </div>
          <label
            >⌕
            <input id="search" placeholder="업무명, 작업자, RMS 검색" /></label
          ><button id="refresh">↻</button><i>CX</i>
        </header>
        <section>
          <div class="intro">
            <div>
              <h2>CX 업무 관리</h2>
              <p id="updated"></p>
            </div>
            <div id="editHint" class="task-actions">
              <button id="newTask">＋ 새 업무</button>
              <button id="deleteToggle">삭제</button>
              <button id="saveAll" disabled>저장</button>
              <button id="reorderToggle" aria-pressed="false">↕ 순서 변경</button>
            </div>
          </div>
          <article class="panel">
            <div class="tools">
              <div>
                <button class="active" data-tab="list">전체 목록</button
                ><button data-tab="active">활성화</button>
                <button data-tab="people">개인별 보기</button>
                <button data-tab="workers">작업자 목록</button>
              </div>
              <span
                ><select id="worker">
                  <option value="all">전체 작업자</option></select
                ><select id="status">
                  <option value="all">전체 단계</option>
                </select></span
              >
            </div>
            <div id="list" class="table">
              <table>
                <thead>
                  <tr>
                    <th>등록</th>
                    <th>RMS</th>
                    <th>작업자</th>
                    <th>단계</th>
                    <th>완료 &amp; 반영일</th>
                    <th>업무제목</th>
                    <th>비고</th>
                    <th>실 작업시간</th>
                    <th>조정</th>
                  </tr>
                </thead>
                <tbody id="rows"></tbody>
              </table>
            </div>
            <div id="people" hidden></div>
            <div id="workers" hidden><h3>작업자 목록</h3><div id="workerAdminList"></div></div>
            <footer>
              <span id="count"></span
              ><span id="saveStatus" role="status" aria-live="polite">● Apps Script 연결 대기</span>
            </footer>
          </article>
        </section>
      </main>
    </div>
    <script src="config.js?v=20260919-7"></script>
    <script src="app.js?v=20260919-7"></script>
  </body>
</html>
